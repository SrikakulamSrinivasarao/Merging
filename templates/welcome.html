<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <style>
        body {
            background: url('/static/background.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 800px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .container {
            margin-top: 50px;
            text-align: center;
            color:rgb(244, 238, 238);
        }

        h1 {
            color:rgb(9, 9, 9);
        }

        p {
            color: #f8f9fa;
        }

        .btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome, {{ username }}!</h1>
        <h2>Welcome to {{ website_name }}</h2>
        <p>Explore and analyze data with Elasticsearch visualizations.</p>
        <a href="/elasticsearch" class="btn">View Elasticsearch Visualizations</a>
    </div>
</body>
</html>
